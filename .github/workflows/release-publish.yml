name: Build & Push Docker Image

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json | sed 's/-pre-prod//')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare Docker tags
        id: prepare_tags
        run: |
          # Determine tag depending on branch
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            TAG="${VERSION}-pre-prod"
            EXTRA_TAG="pre-release"
          else
            TAG="${VERSION}"
            EXTRA_TAG="latest"
          fi

          DOCKER_TAG="ghcr.io/Baptiste-Ferrand/Portfolio:${TAG}"
          DOCKER_EXTRA="ghcr.io/Baptiste-Ferrand/Portfolio:${EXTRA_TAG}"
          echo "DOCKER_TAGS=${DOCKER_TAG},${DOCKER_EXTRA}" >> $GITHUB_ENV
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT
          echo "docker_extra=${DOCKER_EXTRA}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          target: prod
          tags: ${{ env.DOCKER_TAGS }}
          labels: |
            org.opencontainers.image.title=Express Template Application
            org.opencontainers.image.description=Express.js application
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deployment summary
        run: |
          echo "## Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker tags: ${{ env.DOCKER_TAGS }}" >> $GITHUB_STEP_SUMMARY